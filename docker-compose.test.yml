# The disposable test site. Everything it needs is in this repository and
# public images: no secrets, no host paths.
#
# Two layers:
#   db + wpcli        always. PHPUnit (`make test`) runs inside `wpcli`; no web
#                     server is needed for it.
#   wordpress         profile "http", started only for the targets that need a
#                     real site over HTTP (`make test-integration`, `test-all`).
#
# WordPress core is not taken from an image: bin/test-env-init.sh downloads it
# with WP-CLI (`WP_VERSION`, default latest) into a RAM-backed docroot shared by
# `wpcli` and `wordpress`, so the suite tracks new WordPress releases without
# image pulls. The database lives in RAM too; each start provisions a fresh site
# in a few seconds.
#
# Images are pinned (PHP_VERSION, DB_IMAGE), so nothing moves under the suite and
# no superseded image is left behind. DB_IMAGE=mysql:8.4 runs the same suite on
# MySQL.

x-db-env: &db-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
  WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
  WORDPRESS_DB_NAME: ${WORDPRESS_TEST_DB_NAME:-wordpress_test}

# The plugin under test, mounted into the shared docroot.
x-site-volumes: &site-volumes
  - wp_test_core:/var/www/html
  - ./:/var/www/html/wp-content/plugins/members-for-kofi

services:
  db:
    image: ${DB_IMAGE:-mariadb:11.4}
    # A handful of test tables needs none of the server's default memory or
    # durability. The datadir is in RAM and thrown away with the container.
    command:
      - --performance-schema=OFF
      - --skip-log-bin
      - --innodb-buffer-pool-size=48M
      - --innodb-log-file-size=8M
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-doublewrite=OFF
      - --max-connections=30
    tmpfs:
      - /var/lib/mysql:size=256m
    environment:
      # Read by both the MariaDB and the MySQL image.
      MYSQL_DATABASE: ${WORDPRESS_TEST_DB_NAME:-wordpress_test}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wp}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
    healthcheck:
      # MariaDB's own check; the MySQL image has no healthcheck.sh, so fall back.
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized 2>/dev/null || mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 1s
      timeout: 5s
      retries: 120
    # Memory caps, swap included (memswap_limit equals mem_limit). The machine
    # running the tests may share its memory with other services, and an
    # uncapped stack can push it into swap until it stops responding. With caps,
    # a run that needs too much fails on its own.
    mem_limit: 384m
    memswap_limit: 384m
    networks:
      - wptestnet

  wpcli:
    image: wordpress:cli-php${PHP_VERSION:-8.3}
    # Kept running, so the RAM-backed docroot stays mounted between the steps of
    # a run, and every `wp` call or test run is an `exec`, not a new container.
    command: ["tail", "-f", "/dev/null"]
    user: "33:33" # www-data in the Apache image, which shares the docroot
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      HOME: /tmp
    working_dir: /var/www/html
    volumes: *site-volumes
    # PHPUnit runs in here, so this cap covers the suite.
    mem_limit: 384m
    memswap_limit: 384m
    networks:
      - wptestnet

  wordpress:
    image: wordpress:php${PHP_VERSION:-8.3}-apache
    profiles: ["http"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      WORDPRESS_DEBUG: 1
    ports:
      # Loopback only. Without the address Docker publishes on every interface,
      # and its NAT rules bypass the host firewall: this site, with its
      # admin/admin login and the repository mounted read-write, would be
      # reachable from outside.
      - "127.0.0.1:${WP_TEST_PORT:-8101}:80"
    # The image copies its own core into an empty docroot; wpcli has already
    # downloaded core there, so the copy is skipped and the version stays the
    # one WP_VERSION asked for. Do not set working_dir: core would be copied
    # into the mounted plugin.
    volumes: *site-volumes
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      - wptestnet

volumes:
  # RAM-backed and shared by wpcli and wordpress. Its content lasts while a
  # container holds it; `make test-env-down` discards it, and the next start
  # downloads core again.
  wp_test_core:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,uid=33,gid=33,mode=0755"

networks:
  wptestnet:
