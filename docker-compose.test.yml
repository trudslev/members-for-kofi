services:
  wordpress:
    image: wordpress:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WORDPRESS_DB_NAME: ${WORDPRESS_TEST_DB_NAME:-wordpress_test}
      WORDPRESS_DEBUG: 1
    ports:
      - "${WP_TEST_PORT:-8101}:80"
    volumes:
      - wp_test_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/members-for-kofi
    # NB: do not set working_dir here. The WordPress image installs core into
    # its working directory, which would copy WordPress into the mounted plugin.
    networks:
      - wptestnet

  db:
    image: mysql:lts
    environment:
      MYSQL_DATABASE: ${WORDPRESS_TEST_DB_NAME:-wordpress_test}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wp}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db_test_data:/var/lib/mysql
    networks:
      - wptestnet

  wpcli:
    image: wordpress:cli
    depends_on:
      - wordpress
    user: "33:33" # www-data
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WORDPRESS_DB_NAME: ${WORDPRESS_TEST_DB_NAME:-wordpress_test}
    working_dir: /var/www/html
    volumes:
      - wp_test_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/members-for-kofi
    networks:
      - wptestnet

volumes:
  wp_test_data:
  db_test_data:

networks:
  wptestnet:
